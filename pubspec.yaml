name: flightsim_companion
description: "Kneeboard and flight planning companion for X-Plane 12 and MSFS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^18.1.4

  # State management
  provider: ^6.1.5+1

  # Storage
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6

  # Navdata import
  http: ^1.6.0
  csv: ^8.0.0

  # UI
  flex_color_scheme: ^9.0.0

  # Utilities
  intl: ^0.20.3
  material_ui: ^1.11.1
  perfect_freehand: ^2.5.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
